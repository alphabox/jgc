name: CI
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: liberica
          cache: maven
      - name: Build and test Jar
        run: ./mvnw --batch-mode verify
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI image
        run: |
          ./mvnw --batch-mode spring-boot:build-image \
            -DskipTests \
            -Dimage.publish=true \
            -Dimage.name=ghcr.io/alphabox/jgc:latest \
            -Dimage.additional-names=ghcr.io/alphabox/jgc:${GITHUB_SHA::8}-$(date +%s)
